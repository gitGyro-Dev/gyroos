name: Priority C refinement

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/priority-c-refinement.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply focused Priority C refinements
        shell: python
        run: |
          from base64 import b64decode
          from pathlib import Path

          encoded = {
            "docs/40_boundary_state_runtime_definition.md": "",
            "docs/41_boundary_aware_slice_done.md": "",
            "docs/44_void_position_and_boundary_relation.md": "",
            "docs/45_boundary_memory_and_trajectory_preservation.md": "",
            "docs/46_boundary_aware_api_mapping.md": "",
            "docs/47_boundary_aware_poc_impact.md": ""
          }

          marker = "## Priority C-10 Refinement"
          changed = []
          for filename, payload in encoded.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  appendix = b64decode(payload).decode("utf-8")
                  path.write_text(text.rstrip() + appendix, encoding="utf-8")
                  changed.append(filename)

          workflow = Path('.github/workflows/priority-c-refinement.yml')
          if workflow.exists():
              workflow.unlink()
              changed.append(str(workflow))

          print("Changed:")
          for item in changed:
              print(f"- {item}")

      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/40_boundary_state_runtime_definition.md \
                  docs/41_boundary_aware_slice_done.md \
                  docs/44_void_position_and_boundary_relation.md \
                  docs/45_boundary_memory_and_trajectory_preservation.md \
                  docs/46_boundary_aware_api_mapping.md \
                  docs/47_boundary_aware_poc_impact.md \
                  .github/workflows/priority-c-refinement.yml
          git diff --cached --quiet || git commit -m "Refine Priority C Boundary-aware runtime documents"
          git push
