name: Priority F Bounded PoC

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "poc/**"
      - "tests/test_bounded_api.py"
      - "tests/test_priority_f_poc.py"
      - "tests/test_sqlite_repository.py"
      - "tests/test_restart_recovery.py"
      - "tests/test_runtime_settings.py"
      - "tests/test_authentication_boundary.py"
      - "tests/test_resource_limits.py"
      - "tests/test_sqlite_locking.py"
      - "tests/test_observability.py"
      - "tests/test_schema_compatibility.py"
      - "tests/test_backup_restore.py"
      - "tests/test_security_hardening.py"
      - "tests/test_load_stress.py"
      - "tests/vnext/**"
      - "requirements-api.txt"
      - ".github/workflows/priority-f-poc.yml"
  pull_request:
    paths:
      - "app/**"
      - "poc/**"
      - "tests/test_bounded_api.py"
      - "tests/test_priority_f_poc.py"
      - "tests/test_sqlite_repository.py"
      - "tests/test_restart_recovery.py"
      - "tests/test_runtime_settings.py"
      - "tests/test_authentication_boundary.py"
      - "tests/test_resource_limits.py"
      - "tests/test_sqlite_locking.py"
      - "tests/test_observability.py"
      - "tests/test_schema_compatibility.py"
      - "tests/test_backup_restore.py"
      - "tests/test_security_hardening.py"
      - "tests/test_load_stress.py"
      - "tests/vnext/**"
      - "requirements-api.txt"
      - ".github/workflows/priority-f-poc.yml"

permissions:
  contents: read

jobs:
  test-and-run-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Run bounded Runtime and production hardening tests
        run: python -m pytest tests/test_bounded_api.py tests/test_priority_f_poc.py tests/test_sqlite_repository.py tests/test_restart_recovery.py tests/test_runtime_settings.py tests/test_authentication_boundary.py tests/test_resource_limits.py tests/test_sqlite_locking.py tests/test_observability.py tests/test_schema_compatibility.py tests/test_backup_restore.py tests/test_security_hardening.py tests/test_load_stress.py tests/vnext/test_semantic_models.py tests/vnext/test_stability_scene_builder.py tests/vnext/test_stability_observation_builder.py tests/vnext/test_boundary_evaluation_builder.py tests/vnext/test_semantic_realization_bundle_builder.py tests/vnext/test_difference_object_builder.py tests/vnext/test_semantic_assembly_service.py tests/vnext/test_incorporated_readability.py tests/vnext/test_scene_readability_relation.py tests/vnext/test_readability_relation_bundle.py tests/vnext/test_incorporated_readability_assembly_service.py tests/vnext/test_continuity_readability.py tests/vnext/test_continuity_readability_assembly_service.py tests/vnext/test_trajectory_layer.py tests/vnext/test_trajectory_assembly_service.py tests/vnext/test_read_only_runtime_projection.py tests/vnext/test_experimental_repository.py tests/vnext/test_json_artifact_repository_settings.py tests/vnext/test_json_artifact_path_policy.py tests/vnext/test_json_artifact_repository.py tests/vnext/test_experimental_api_models.py tests/vnext/test_experimental_api_provider.py tests/vnext/test_experimental_api_routes.py tests/vnext/test_consumer_boundary_models.py tests/vnext/test_consumer_boundary_service.py tests/vnext/test_consumer_http_transport.py tests/vnext/test_consumer_compatibility_models.py tests/vnext/test_consumer_compatibility_service.py tests/vnext/test_consumer_compatibility_api.py tests/vnext/test_inspection_receipt_models.py tests/vnext/test_inspection_receipt_service.py tests/vnext/test_inspection_receipt_api.py tests/vnext/test_inspection_batch_manifest_models.py tests/vnext/test_inspection_batch_manifest_service.py tests/vnext/test_inspection_batch_manifest_api.py -q

      - name: Generate PoC result artifacts
        run: python poc/run_poc.py --output-dir poc/results

      - name: Verify PoC result artifact count
        shell: bash
        run: |
          set -euo pipefail
          test "$(find poc/results -maxdepth 1 -name '*_result.json' | wc -l)" -eq 5

      - name: Upload PoC result artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: priority-f-poc-results
          path: poc/results/*.json
          if-no-files-found: error
          retention-days: 30
