name: Priority F Bounded PoC

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "poc/**"
      - "tests/test_bounded_api.py"
      - "tests/test_priority_f_poc.py"
      - "requirements-api.txt"
      - ".github/workflows/priority-f-poc.yml"
  pull_request:
    paths:
      - "app/**"
      - "poc/**"
      - "tests/test_bounded_api.py"
      - "tests/test_priority_f_poc.py"
      - "requirements-api.txt"
      - ".github/workflows/priority-f-poc.yml"

permissions:
  contents: read

jobs:
  test-and-run-poc:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Run bounded API and PoC tests
        run: python -m pytest tests/test_bounded_api.py tests/test_priority_f_poc.py -q

      - name: Generate PoC result artifacts
        run: python poc/run_poc.py --output-dir poc/results

      - name: Upload PoC result artifacts
        uses: actions/upload-artifact@v4
        with:
          name: priority-f-poc-results
          path: poc/results/*.json
          if-no-files-found: error
          retention-days: 30
