name: Priority F Bounded PoC

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "poc/**"
      - "tests/test_bounded_api.py"
      - "tests/test_priority_f_poc.py"
      - "tests/test_sqlite_repository.py"
      - "tests/test_restart_recovery.py"
      - "tests/test_runtime_settings.py"
      - "tests/test_authentication_boundary.py"
      - "tests/test_resource_limits.py"
      - "tests/test_sqlite_locking.py"
      - "tests/test_observability.py"
      - "tests/test_schema_compatibility.py"
      - "tests/test_backup_restore.py"
      - "requirements-api.txt"
      - ".github/workflows/priority-f-poc.yml"
  pull_request:
    paths:
      - "app/**"
      - "poc/**"
      - "tests/test_bounded_api.py"
      - "tests/test_priority_f_poc.py"
      - "tests/test_sqlite_repository.py"
      - "tests/test_restart_recovery.py"
      - "tests/test_runtime_settings.py"
      - "tests/test_authentication_boundary.py"
      - "tests/test_resource_limits.py"
      - "tests/test_sqlite_locking.py"
      - "tests/test_observability.py"
      - "tests/test_schema_compatibility.py"
      - "tests/test_backup_restore.py"
      - "requirements-api.txt"
      - ".github/workflows/priority-f-poc.yml"

permissions:
  contents: read

jobs:
  test-and-run-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Run bounded Runtime and production hardening tests
        run: python -m pytest tests/test_bounded_api.py tests/test_priority_f_poc.py tests/test_sqlite_repository.py tests/test_restart_recovery.py tests/test_runtime_settings.py tests/test_authentication_boundary.py tests/test_resource_limits.py tests/test_sqlite_locking.py tests/test_observability.py tests/test_schema_compatibility.py tests/test_backup_restore.py -q

      - name: Generate PoC result artifacts
        run: python poc/run_poc.py --output-dir poc/results

      - name: Verify PoC result artifact count
        shell: bash
        run: |
          set -euo pipefail
          test "$(find poc/results -maxdepth 1 -name '*_result.json' | wc -l)" -eq 5

      - name: Upload PoC result artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: priority-f-poc-results
          path: poc/results/*.json
          if-no-files-found: error
          retention-days: 30
